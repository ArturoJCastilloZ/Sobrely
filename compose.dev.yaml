# Entorno de DESARROLLO con recarga en caliente (HMR). No es el compose de producción
# (`compose.yaml`, que compila una imagen y no ve tus archivos).
#
#   1. supabase start                      (la base local)
#   2. scripts/dev-env.sh                  (genera .env.dev.local con las llaves de la base LOCAL)
#   3. docker compose -f compose.dev.yaml up
#
# Si el contenedor de producción ya ocupa el 3000: `docker compose down` en la raíz, o usa otro
# puerto con `DEV_PORT=3200 docker compose -f compose.dev.yaml up`.
#
# Seguridad: este servicio NUNCA lee `.env.local` (es el de producción: Supabase real,
# Mercado Pago). Su entorno sale solo de `.env.dev.local`, y `.env.local` se tapa con un archivo
# vacío para que `next dev` no lo cargue por su cuenta.
name: invitaflow-dev

services:
  web:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - .env.dev.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # El almacén de pnpm fuera de /app: si no, pnpm lo crea dentro del proyecto (.pnpm-store)
      # porque el volumen de /app y el de la caché están en discos distintos.
      npm_config_store_dir: /pnpm-store
      # Bind mounts de Docker en macOS no avisan de cambios: sin esto no hay recarga.
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:${DEV_PORT:-3000}
    ports:
      - "${DEV_PORT:-3000}:3000"
    volumes:
      - .:/app
      # El código es el de tu carpeta; lo compilado y las dependencias viven en volúmenes
      # (las de macOS no sirven en Linux, y así no ensucian tu carpeta).
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm-store
      - /dev/null:/app/.env.local:ro
    # El navegador y el servidor deben ver la base local en la MISMA URL (127.0.0.1:54321). En el
    # navegador es tu Mac; dentro del contenedor ese puerto no existe, así que `socat` lo reenvía
    # a la Mac (`host.docker.internal`). Sin esto habría que cambiar el código para tener dos URL.
    command: >
      sh -c "apk add --no-cache socat libc6-compat >/dev/null &&
      (socat TCP-LISTEN:54321,fork,reuseaddr TCP:host.docker.internal:54321 &) &&
      corepack enable &&
      pnpm install --frozen-lockfile &&
      exec pnpm exec next dev -H 0.0.0.0 -p 3000"
    init: true

volumes:
  node_modules:
  next_cache:
  pnpm_store:
