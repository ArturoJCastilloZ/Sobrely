<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <filter id="papelR"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="oroR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcb679"/><stop offset="50%" stop-color="#b8914f"/><stop offset="100%" stop-color="#e7cd9c"/>
    </linearGradient>
    <radialGradient id="rubor" cx="50%" cy="4%" r="46%">
      <stop offset="0%" stop-color="#e8b4b8" stop-opacity="0.5"/><stop offset="100%" stop-color="#e8b4b8" stop-opacity="0"/>
    </radialGradient>

    <!-- ROSA de petalos RELLENOS, tercera version. Las dos anteriores eran de
         trazo y a ~25px se leian como un caracol: la espiral dominaba sobre
         los petalos. A este tamaño el trazo no funciona — la masa si.
         Tres tonos: el mas oscuro al centro, el mas claro afuera. Ese orden es
         lo que hace que se lea como una flor abierta y no como un circulo. -->
    <g id="rosa">
      <circle cx="0" cy="2" r="13" fill="#dda9b0"/>
      <path d="M-13 2 A13 13 0 0 1 0 -11 A9 9 0 0 0 -9 -2 Z" fill="#e8bfc4"/>
      <path d="M13 2 A13 13 0 0 1 0 15 A9 9 0 0 0 9 6 Z" fill="#e8bfc4"/>
      <circle cx="0" cy="2" r="8.5" fill="#cf929b"/>
      <path d="M-8.5 2 A8.5 8.5 0 0 1 2 -6 A5 5 0 0 0 -4 0 Z" fill="#dda9b0"/>
      <circle cx="0.5" cy="2.5" r="4.6" fill="#bd7c88"/>
      <path d="M-3 1 C-1 -1 2 -1 3.6 1" fill="none" stroke="#a9646f" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <g id="hojaR"><path d="M0 0 C7 -6 16 -4 20 0 C16 4 7 6 0 0Z" fill="#9aa583"/></g>
    <g id="hojaClara"><path d="M0 0 C7 -6 16 -4 20 0 C16 4 7 6 0 0Z" fill="#b7c0a1"/></g>
  </defs>

  <rect width="420" height="900" fill="#faf3f0"/>
  <rect width="420" height="900" fill="url(#rubor)"/>

  <!-- Guirnalda en el ARCO SUPERIOR, abierta en el centro para que respire el
       nombre. Rosas grandes en las esquinas y pequeñas hacia el centro: el
       degradado de escala es lo que la hace leer como ramo y no como una fila
       de sellos. -->
  <g opacity="0.95">
    <use href="#hojaR" transform="translate(16 96) rotate(38)"/>
    <use href="#rosa" transform="translate(46 70) scale(1.35)"/>
    <use href="#hojaClara" transform="translate(74 46) rotate(-34)"/>
    <use href="#rosa" transform="translate(106 38) scale(0.92) rotate(10)"/>
    <use href="#hojaR" transform="translate(132 56) rotate(28) scale(0.9)"/>
    <use href="#rosa" transform="translate(154 28) scale(0.6)"/>

    <use href="#rosa" transform="translate(266 28) scale(0.6)"/>
    <use href="#hojaR" transform="translate(288 54) rotate(-208) scale(0.9)"/>
    <use href="#rosa" transform="translate(314 38) scale(0.92) rotate(-10)"/>
    <use href="#hojaClara" transform="translate(346 46) rotate(214)"/>
    <use href="#rosa" transform="translate(374 70) scale(1.3)"/>
    <use href="#hojaR" transform="translate(404 96) rotate(142)"/>
  </g>
  <g opacity="0.45">
    <use href="#rosa" transform="translate(34 830) scale(1.15)"/>
    <use href="#hojaR" transform="translate(64 850) rotate(22)"/>
    <use href="#rosa" transform="translate(388 852) scale(1.05)"/>
  </g>

  <rect x="21" y="21" width="378" height="858" fill="none" stroke="url(#oroR)" stroke-width="1.1" opacity="0.8"/>
  <rect width="420" height="900" filter="url(#papelR)" opacity="0.045"/>
</svg>
