<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="46%" stop-color="#eef5fd"/><stop offset="100%" stop-color="#fbfcfe"/>
    </linearGradient>
    <!-- Nube por union de circulos con un blur suave: el borde duro de un
         circulo delata la geometria; el blur lo vuelve algodon. -->
    <filter id="algodon"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="nube" fill="#ffffff">
      <circle cx="0" cy="0" r="24"/><circle cx="26" cy="6" r="18"/><circle cx="-26" cy="8" r="16"/>
      <circle cx="12" cy="-14" r="16"/><ellipse cx="0" cy="16" rx="40" ry="12"/>
    </g>
    <g id="lunita" fill="none" stroke="#c7b8e6" stroke-width="1.4">
      <path d="M6 -11 A12 12 0 1 0 6 11 A9.5 9.5 0 1 1 6 -11Z"/>
    </g>
  </defs>

  <rect width="420" height="900" fill="url(#cielo)"/>

  <!-- Nubes en el ARCO SUPERIOR, ninguna en el centro: el texto va oscuro y
       una nube blanca justo detras le quitaria el poco contraste que tiene. -->
  <g filter="url(#algodon)" opacity="0.92">
    <use href="#nube" transform="translate(58 96) scale(1.15)"/>
    <use href="#nube" transform="translate(326 62) scale(0.9)"/>
    <use href="#nube" transform="translate(196 34) scale(0.72)"/>
    <use href="#nube" transform="translate(384 178) scale(0.6)"/>
    <use href="#nube" transform="translate(30 856) scale(0.85)"/>
    <use href="#nube" transform="translate(360 872) scale(0.7)"/>
  </g>

  <g opacity="0.8">
    <use href="#lunita" transform="translate(348 132) rotate(18)"/>
    <circle cx="108" cy="42" r="2.2" fill="#c7b8e6"/>
    <circle cx="252" cy="118" r="1.8" fill="#c7b8e6"/>
    <circle cx="46" cy="176" r="1.6" fill="#c7b8e6"/>
    <circle cx="300" cy="206" r="1.5" fill="#c7b8e6" opacity="0.7"/>
    <circle cx="150" cy="828" r="1.8" fill="#c7b8e6" opacity="0.6"/>
  </g>
</svg>
