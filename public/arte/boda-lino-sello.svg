<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <!-- Trama de lino: DOS turbulencias cruzadas. Una sola da grano de ruido;
         estirar la frecuencia en un eje es lo que sugiere hilo tejido. -->
    <filter id="tela"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="3" seed="19"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="tela2"><feTurbulence type="fractalNoise" baseFrequency="0.6 0.02" numOctaves="3" seed="23"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="cera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8452f"/><stop offset="50%" stop-color="#8c3524"/><stop offset="100%" stop-color="#6f2618"/>
    </linearGradient>
  </defs>
  <rect width="420" height="900" fill="#efe9dd"/>
  <rect width="420" height="900" filter="url(#tela)" opacity="0.07"/>
  <rect width="420" height="900" filter="url(#tela2)" opacity="0.05"/>
  <!-- Solapa de sobre en el borde SUPERIOR: es la banda que la miniatura si
       ve, y da identidad al primer golpe de vista sin invadir el centro. -->
  <path d="M0 0 H420 V40 L210 114 L0 40 Z" fill="#e5dccb" opacity="0.9"/>
  <path d="M0 40 L210 114 L420 40" fill="none" stroke="#c9b899" stroke-width="1.1"/>
  <!-- Sello de cera bajo la punta: el detalle que hace que se lea como
       papeleria y no como un degradado.
       ESTA A y=114 Y NO A 152 POR MEDICION, no por gusto. A 152 caia dentro de
       la banda donde va el texto, y un disco rojo oscuro ahi hundia el
       contraste al 1.65 con texto oscuro y 1.17 con claro: el arte no admitia
       NINGUN texto legible. Lo cazo `verificar-contraste-arte.mts`, que mide
       el peor pixel y no el promedio — de media este fondo "pasaba". -->
  <g transform="translate(210 114)">
    <circle r="17" fill="url(#cera)"/>
    <circle r="17" fill="none" stroke="#5e1f13" stroke-width="0.7" opacity="0.5"/>
    <circle r="12" fill="none" stroke="#e8c9b0" stroke-width="0.6" opacity="0.45"/>
    <path d="M-5 3 C-5 -3 0 -6 0 -1 C0 -6 5 -3 5 3 L0 7 Z" fill="#f1d6c2" opacity="0.75"/>
  </g>
  <rect x="24" y="160" width="372" height="714" fill="none" stroke="#b9a684" stroke-width="0.7" opacity="0.55"/>
</svg>
