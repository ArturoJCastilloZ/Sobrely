<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <filter id="lino">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- DOS verdes, no uno. Una rama de un solo tono se lee como una silueta;
         el contraste entre la hoja de arriba y la de abajo es lo que da
         volumen sin dibujar sombras. -->
    <g id="hojaOsc"><path d="M0 0 C9 -6 19 -4 23 0 C19 4 9 6 0 0Z" fill="#5f7358"/></g>
    <g id="hojaClr"><path d="M0 0 C9 -6 19 -4 23 0 C19 4 9 6 0 0Z" fill="#8fa383"/></g>
    <g id="rama">
      <path d="M0 0 C40 -12 88 -17 132 -9" fill="none" stroke="#5c6f55" stroke-width="1.7"/>
      <use href="#hojaOsc" transform="translate(12 -4) rotate(-42)"/>
      <use href="#hojaClr" transform="translate(18 -2) rotate(38) scale(0.92)"/>
      <use href="#hojaOsc" transform="translate(40 -9) rotate(-34) scale(1.08)"/>
      <use href="#hojaClr" transform="translate(47 -6) rotate(31)"/>
      <use href="#hojaOsc" transform="translate(70 -13) rotate(-27) scale(1.02)"/>
      <use href="#hojaClr" transform="translate(77 -10) rotate(25) scale(0.9)"/>
      <use href="#hojaOsc" transform="translate(100 -15) rotate(-20) scale(0.88)"/>
      <use href="#hojaClr" transform="translate(106 -12) rotate(18) scale(0.78)"/>
      <use href="#hojaOsc" transform="translate(124 -12) rotate(-12) scale(0.62)"/>
    </g>
    <!-- Una flor blanca por esquina: el punto de luz que separa el follaje del
         fondo crema y evita que el verde se empaste. -->
    <g id="flor">
      <g fill="#fffdf8" stroke="#e3ddcd" stroke-width="0.5">
        <ellipse rx="7" ry="4.5" transform="rotate(0)"/><ellipse rx="7" ry="4.5" transform="rotate(72)"/>
        <ellipse rx="7" ry="4.5" transform="rotate(144)"/><ellipse rx="7" ry="4.5" transform="rotate(216)"/>
        <ellipse rx="7" ry="4.5" transform="rotate(288)"/>
      </g>
      <circle r="2.1" fill="#c9a961"/>
    </g>
  </defs>

  <rect width="420" height="900" fill="#f7f4ec"/>

  <!-- Racimos en las esquinas, centro libre: ahi va el nombre, que es el foco.
       Es la diferencia entre decorar y estorbar. Opacidad 0.9 y no 0.5: al 50%
       sobre crema el verde desaparecia y se leia como suciedad. -->
  <g opacity="0.9">
    <use href="#rama" transform="translate(-22 104) rotate(16)"/>
    <use href="#rama" transform="translate(-6 150) rotate(-8) scale(0.72)"/>
    <use href="#flor" transform="translate(46 128)"/>

    <use href="#rama" transform="translate(442 66) rotate(164) scale(0.95)"/>
    <use href="#rama" transform="translate(430 26) rotate(190) scale(0.7)"/>
    <use href="#flor" transform="translate(372 74) scale(0.9)"/>

    <use href="#rama" transform="translate(-16 826) rotate(-18) scale(1.06)"/>
    <use href="#rama" transform="translate(-4 782) rotate(8) scale(0.68)"/>
    <use href="#flor" transform="translate(54 806) scale(0.95)"/>

    <use href="#rama" transform="translate(444 872) rotate(-162)"/>
    <use href="#flor" transform="translate(366 856) scale(0.85)"/>
  </g>

  <!-- Filete doble, el recurso mas viejo de la papeleria fina: encuadra sin
       competir. A 22px del borde para sobrevivir al recorte de la miniatura. -->
  <rect x="22" y="22" width="376" height="856" fill="none" stroke="#b39a63" stroke-width="0.9" opacity="0.7"/>
  <rect x="27" y="27" width="366" height="846" fill="none" stroke="#b39a63" stroke-width="0.45" opacity="0.45"/>

  <rect width="420" height="900" filter="url(#lino)" opacity="0.05"/>
</svg>
