<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <!-- ARQUITECTURA A · BANDA DIAGONAL A SANGRE (2026-09-09, 3.ª sesión).
       Rompe a propósito el esquema de banda lateral espejada que compartían
       las 46 piezas. Medido antes de dibujar: en la franja que la página a
       1200 px enseña (y 293..608) esta pieza tenía 0.75 % de tinta y CERO en
       el centro, así que a escritorio eran dos líneas y un punto.
       La composición es TONAL y no de trazo: el piso de luminancia para pasar
       AA contra el texto oscuro es ~0.28 y estos rosas están en 0.7+, así que
       cruzar el centro no cuesta contraste. Lo que costaba era la densidad
       del trazo, no la posición. -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="63" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>
  <rect width="420" height="900" fill="#fff7fa"/>
  <!-- La banda cruza el lienzo entero de esquina a esquina: se ve en las tres
       superficies porque el ancho no se recorta y su tramo central cae dentro
       de y 293..608. -->
  <path d="M0 900 L420 268 L420 452 L0 900 Z" fill="#fbdbe8"/>
  <path d="M0 838 L420 206 L420 268 L0 900 Z" fill="#f7c9dc"/>
  <line x1="0" y1="838" x2="420" y2="206" stroke="#be185d" stroke-opacity="0.28" stroke-width="1.4"/>
  <line x1="0" y1="900" x2="420" y2="452" stroke="#be185d" stroke-opacity="0.16" stroke-width="1"/>
  <!-- Un solo acento, descentrado: nada de pares espejados. -->
  <circle cx="330" cy="360" r="46" fill="none" stroke="#be185d" stroke-opacity="0.22" stroke-width="1.4"/>
  <circle cx="330" cy="360" r="3.4" fill="#be185d" fill-opacity="0.3"/>
  <circle cx="96" cy="742" r="2.6" fill="#f9a8d4" fill-opacity="0.9"/>
  <rect width="420" height="900" filter="url(#papel)" opacity="0.03"/>
</svg>
