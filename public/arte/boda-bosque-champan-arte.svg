<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="9" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <radialGradient id="aura" cx="50%" cy="100%" r="80%"><stop offset="0%" stop-color="#27483a" stop-opacity="0.5"/><stop offset="100%" stop-color="#27483a" stop-opacity="0"/></radialGradient>
    <g id="ramita"><path d="M0 0 C-6 -40 6 -80 0 -130" fill="none" stroke="#cdb98a" stroke-opacity="0.6" stroke-width="1.3"/><ellipse cx="9" cy="-14" rx="9" ry="4" transform="rotate(-35 9 -14)" fill="#cdb98a" fill-opacity="0.7"/><ellipse cx="-9" cy="-34" rx="9" ry="4" transform="rotate(35 -9 -34)" fill="#6f8f78" fill-opacity="0.7"/><ellipse cx="9" cy="-54" rx="9" ry="4" transform="rotate(-35 9 -54)" fill="#6f8f78" fill-opacity="0.7"/><ellipse cx="-9" cy="-74" rx="9" ry="4" transform="rotate(35 -9 -74)" fill="#cdb98a" fill-opacity="0.7"/><ellipse cx="9" cy="-94" rx="9" ry="4" transform="rotate(-35 9 -94)" fill="#6f8f78" fill-opacity="0.7"/><ellipse cx="-9" cy="-114" rx="9" ry="4" transform="rotate(35 -9 -114)" fill="#6f8f78" fill-opacity="0.7"/><ellipse cx="0" cy="-134" rx="9" ry="4" transform="rotate(-90 0 -134)" fill="#cdb98a" fill-opacity="0.75"/></g>
  </defs>
  <!-- Bosque y champan: verde bosque con ramitas en champan y salvia, solo en las franjas laterales y las esquinas. El centro queda vacio de arriba abajo. -->
  <rect width="420" height="900" fill="#13241c"/>
  <rect width="420" height="900" fill="url(#aura)"/>
  <rect width="420" height="900" filter="url(#papel)" opacity="0.05"/>
  <use href="#ramita" transform="translate(7 200) rotate(-8) scale(0.8)"/><use href="#ramita" transform="translate(413 200) scale(-0.8 0.8) rotate(-8)"/><use href="#ramita" transform="translate(9 420) rotate(6) scale(0.8)"/><use href="#ramita" transform="translate(411 420) scale(-0.8 0.8) rotate(6)"/><use href="#ramita" transform="translate(6 640) rotate(-5) scale(0.8)"/><use href="#ramita" transform="translate(414 640) scale(-0.8 0.8) rotate(-5)"/><use href="#ramita" transform="translate(8 800) rotate(10) scale(0.8)"/><use href="#ramita" transform="translate(412 800) scale(-0.8 0.8) rotate(10)"/><use href="#ramita" transform="translate(12 70) rotate(25) scale(1.1 1.1)"/><use href="#ramita" transform="translate(408 70) rotate(-25) scale(-1.1 1.1)"/><use href="#ramita" transform="translate(12 880) rotate(-155) scale(1.1 1.1)"/><use href="#ramita" transform="translate(408 880) rotate(155) scale(-1.1 1.1)"/>
