<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <defs>
    <!-- Acuarela: dos manchas de tinta que se muerden en el centro. El
         desplazamiento por ruido es lo que rompe el borde limpio del gradiente
         y lo vuelve pigmento sobre papel; sin el se ve un degradado de CSS. -->
    <filter id="agua" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="papel">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="rosa" cx="28%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#f19bb8"/><stop offset="62%" stop-color="#f6b8cd" stop-opacity="0.55"/><stop offset="100%" stop-color="#f6b8cd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="azul" cx="76%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#8bb7e2"/><stop offset="62%" stop-color="#a8c9ea" stop-opacity="0.55"/><stop offset="100%" stop-color="#a8c9ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rosa2" cx="62%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#efb0c6"/><stop offset="60%" stop-color="#f4c4d4" stop-opacity="0.5"/><stop offset="100%" stop-color="#f4c4d4" stop-opacity="0"/>
    </radialGradient>
    <g id="estrella">
      <path d="M0-13 3.6-4.2 13 0 3.6 4.2 0 13-3.6 4.2-13 0-3.6-4.2Z"
            fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="420" height="900" fill="#fdf7f8"/>
  <g filter="url(#agua)">
    <rect width="420" height="900" fill="url(#rosa)"/>
    <rect width="420" height="900" fill="url(#azul)"/>
    <rect width="420" height="900" fill="url(#rosa2)"/>
  </g>

  <!-- Estrellas en contorno, no rellenas: dejan leer el texto que va encima. -->
  <g opacity="0.75">
    <use href="#estrella" transform="translate(58 84) scale(1.15)"/>
    <use href="#estrella" transform="translate(126 52) scale(0.8)"/>
    <use href="#estrella" transform="translate(196 96) scale(1.35)"/>
    <use href="#estrella" transform="translate(286 58) scale(0.9)"/>
    <use href="#estrella" transform="translate(352 108) scale(1.1)"/>
    <use href="#estrella" transform="translate(88 168) scale(0.7)"/>
    <use href="#estrella" transform="translate(330 196) scale(0.75)"/>
    <use href="#estrella" transform="translate(44 760) scale(0.95)"/>
    <use href="#estrella" transform="translate(150 828) scale(0.7)"/>
    <use href="#estrella" transform="translate(300 792) scale(1.05)"/>
    <use href="#estrella" transform="translate(376 848) scale(0.8)"/>
  </g>

  <!-- Grano de papel al 4%: a mas se ve sucio, a menos no se nota. -->
  <rect width="420" height="900" filter="url(#papel)" opacity="0.04"/>
</svg>
