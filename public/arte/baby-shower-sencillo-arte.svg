<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <!-- ARQUITECTURA C · HALO ALTO EN EL CENTRO (2026-09-09, 3.ª sesión).
       Un degradado radial centrado en y=350: es la zona que la página a
       1200 px enseña (y 293..608) y donde esta pieza —la más vacía de las 46,
       0.48 % de tinta en esa franja y CERO en el centro— no tenía nada.
       Deliberadamente NO se usan barras redondeadas apiladas: así es como
       `baby-shower-nubes` acabó leyéndose como un esqueleto de carga. Aquí el
       recurso es un campo de tono continuo, sin repetición modular. -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="87" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#d8eefc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="900" fill="#f0f9ff"/>
  <ellipse cx="210" cy="350" rx="252" ry="248" fill="url(#halo)"/>
  <!-- Un anillo fino, descentrado respecto al halo, para que la composición
       tenga un foco y no un eje. -->
  <circle cx="262" cy="316" r="176" fill="none" stroke="#0284c7" stroke-opacity="0.16" stroke-width="1.4"/>
  <!-- Horizonte único abajo, sin gemelo arriba. -->
  <path d="M0 706 C120 682 300 730 420 700" fill="none" stroke="#0284c7" stroke-opacity="0.2" stroke-width="1.6"/>
  <circle cx="124" cy="286" r="3.2" fill="#0284c7" fill-opacity="0.32"/>
  <rect width="420" height="900" filter="url(#papel)" opacity="0.03"/>
</svg>
