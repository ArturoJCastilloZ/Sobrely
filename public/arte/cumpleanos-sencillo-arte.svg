<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <!-- ARQUITECTURA B · ESQUINA ASIMÉTRICA (2026-09-09, 3.ª sesión).
       Un solo arco grande anclado abajo a la izquierda, más un contrapunto
       pequeño arriba a la derecha. No hay eje de simetría, que es lo que hacía
       que las 46 piezas se leyeran como la misma.
       El arco grande sube hasta y=380, así que entra en la franja de 1200 px
       (y 293..608), donde esta pieza medía CERO tinta en el centro. -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="45" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>
  <rect width="420" height="900" fill="#ffffff"/>
  <circle cx="20" cy="900" r="520" fill="#fff1f2"/>
  <circle cx="20" cy="900" r="520" fill="none" stroke="#e11d48" stroke-opacity="0.18" stroke-width="1.4"/>
  <circle cx="20" cy="900" r="392" fill="#ffe4e6"/>
  <circle cx="20" cy="900" r="392" fill="none" stroke="#e11d48" stroke-opacity="0.14" stroke-width="1.2"/>
  <!-- Contrapunto: cae fuera de la franja de 1200 a propósito, para que a
       escritorio la lectura sea UN arco y no un par. -->
  <circle cx="420" cy="128" r="150" fill="#fff1f2"/>
  <circle cx="420" cy="128" r="150" fill="none" stroke="#e11d48" stroke-opacity="0.16" stroke-width="1.2"/>
  <circle cx="352" cy="470" r="3.6" fill="#e11d48" fill-opacity="0.4"/>
  <circle cx="374" cy="516" r="2.4" fill="#fda4af" fill-opacity="0.9"/>
  <rect width="420" height="900" filter="url(#papel)" opacity="0.025"/>
</svg>
