<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" width="420" height="900">
  <!-- ARQUITECTURA DIAGONAL (2026-09-09, 3.a sesion). Escalada por decision
       del dev tras el piloto de tres. Rompe el esquema de banda lateral
       espejada que compartian las 46 piezas: aqui NO hay eje de simetria.
       Medido antes: esta pieza tenia 0.00 % de tinta en el centro de la
       franja que la pagina a 1200 px enseña (y 293..608).
       Variante de esta pieza: descendente muy pronunciada, cinta fina sobre companera palida.
       La composicion es TONAL, no de trazo: el piso de luminancia para
       pasar AA contra texto oscuro es ~0.28 y estos tintes estan muy por
       encima, asi que cruzar el centro no cuesta contraste. -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>
  <rect width="420" height="900" fill="#fdf9ff"/>
    <path d="M0 180 L420 900 L420 1080 L0 360 Z" fill="#faf0fb"/>
  <path d="M0 120 L420 840 L420 900 L0 180 Z" fill="#f4e3f6"/>
  <line x1="0" y1="120" x2="420" y2="840" stroke="#a21caf" stroke-opacity="0.2" stroke-width="1.4"/>
  <circle cx="300" cy="250" r="44" fill="none" stroke="#a21caf" stroke-opacity="0.2" stroke-width="1.4"/><circle cx="300" cy="250" r="3.2" fill="#a21caf" fill-opacity="0.3"/>
  <rect width="420" height="900" filter="url(#papel)" opacity="0.03"/>
</svg>
